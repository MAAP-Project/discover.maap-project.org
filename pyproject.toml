[project]
name = "federated-collection-discovery-deployment"
version = "0.1.0"
description = "AWS CDK application for deploying the Federated Collection Discovery API"
authors = [
    {name = "Henry Rodman", email = "henry@developmentseed.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.258.0",
    "constructs>=10.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1"
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.0.3"
]

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
]
ignore = [
  "BLE001",  # Blind Exceptions
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.markdownlint-cli2.config]
MD013 = false

[tool.ruff.lint.isort]
combine-as-imports = true
